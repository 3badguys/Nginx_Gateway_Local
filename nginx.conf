server {
    listen 80;
    server_name localhost;

    # /gfs/ — frontend pages
    location /gfs/ {
        proxy_pass http://skateboard-frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /gfs/api/ — backend API
    location /gfs/api/ {
        proxy_pass http://skateboard-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Also proxy root-level frontend assets (/assets/, /api-config.js, /manifest.json, /icon-*)
    location /assets/ {
        proxy_pass http://skateboard-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api-config.js {
        proxy_pass http://skateboard-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /manifest.json {
        proxy_pass http://skateboard-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /icon- {
        proxy_pass http://skateboard-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Default: frontend
    location / {
        proxy_pass http://skateboard-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
